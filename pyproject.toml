[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-hypothesis-lab"
version = "0.1.0"
description = "Synthetic-only safety foundation for event-based quantitative research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow==26.0.0"]
security = ["cryptography>=45,<47"]
drive = ["google-api-python-client>=2.140,<3"]
quant = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]
